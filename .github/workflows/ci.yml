name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test CC=${{ matrix.cc }}
      - name: Sanitizers
        if: matrix.cc == 'clang'
        run: make asan CC=clang
      - name: Replay the fuzz corpus under the sanitizers
        if: matrix.cc == 'clang'
        run: make fuzz-replay CC=clang

  conformance:
    # The official tempoxyz/mpp-tools runner, pinned in scripts/conformance.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: mpp-tools conformance vectors
        run: sh scripts/conformance.sh

  fuzz:
    # libFuzzer with ASan and UBSan, a minute per target from the seed corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz
        run: make fuzz-run FUZZ_CC=clang FUZZ_TIME=60

  esp-idf:
    # The ESP32 example compiles against ESP-IDF, with either signer.
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.5, v6.0]
        signer: [atecc608, software]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the software signer
        if: matrix.signer == 'software'
        run: cat examples/esp32-pay/sdkconfig.software >> examples/esp32-pay/sdkconfig.defaults
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32
          path: examples/esp32-pay
